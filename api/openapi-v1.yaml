    CreateSessionResponse:
      type: object
      required: [session_id, wss_url, ticket, ticket_expires_in, ticket_expires_at, scene_type, status]
      properties:
        session_id: { type: string }
        wss_url: { type: string }
        ticket: { type: string }
        ticket_expires_in: { type: integer }
        ticket_expires_at: { type: string, format: date-time }
        scene_type: { type: string }
        status: { type: string }
    SessionListPage:
      type: object
      required: [items, size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionListItem"
        next_cursor:
          type: string
        size: { type: integer }
    SessionListItem:
      type: object
      required: [session_id, scene_type, status, started_at, duration_sec]
      properties:
        session_id: { type: string }
        scene_type: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        duration_sec: { type: integer }
        material_id: { type: string, nullable: true }
    SessionDetail:
      type: object
      required: [session_id, scene_type, status, started_at, duration_sec, materials, utterances]
      properties:
        session_id: { type: string }
        scene_type: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        duration_sec: { type: integer }
        material_id: { type: string, nullable: true }
        materials:
          type: array
          items:
            $ref: "#/components/schemas/SessionMaterialRef"
        utterances:
          type: array
          items:
            $ref: "#/components/schemas/SessionUtterance"
        review:
          $ref: "#/components/schemas/SessionDetailReview"
    SessionMaterialRef:
      type: object
      required: [id]
      properties:
        id: { type: string }
    SessionUtterance:
      type: object
      required: [seq, speaker, text]
      properties:
        seq: { type: integer }
        speaker: { type: string }
        text: { type: string }
    SessionDetailReview:
      type: object
      required: [score]
      properties:
        status:
          type: string
          enum: [pending, ready, failed]
        score: { type: number, format: float }
        dims:
          $ref: "#/components/schemas/ReviewEvalDims"
        suggestions:
          type: array
          items: { type: string }
    ReviewPollResponse:
      type: object
      required: [session_id, status]
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [pending, ready, failed]
        review:
          $ref: "#/components/schemas/ReviewReadyPayload"
          description: Present when status is ready
        eval:
          $ref: "#/components/schemas/ReviewEvalSummary"
          description: B18 three-dimension eval when per-utterance scoring is complete
    ReviewEvalSummary:
      type: object
      required: [score, dims, suggestions, utterance_count, complete]
      properties:
        score: { type: number, format: float }
        dims:
          $ref: "#/components/schemas/ReviewEvalDims"
        suggestions:
          type: array
          items: { type: string }
        utterance_count: { type: integer }
        complete: { type: boolean }
    ReviewEvalDims:
      type: object
      required: [grammar, fluency, vocabulary]
      properties:
        grammar: { type: number, format: float }
        fluency: { type: number, format: float }
        vocabulary: { type: number, format: float }
    ReviewReadyPayload:
      type: object
      required: [generator, status, transcript, overview, evaluation, dual_column, refine_cards, review, refine]
      properties:
        generator:
          type: string
        status:
          type: string
          enum: [ready]
        duration_sec:
          type: integer
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTurn"
        overview:
          type: object
          required: [goal_achievement, issue_count, suggestion_count, comparison_count]
          properties:
            goal_achievement:
              $ref: "#/components/schemas/GoalAchievement"
            issue_count:
              type: integer
            suggestion_count:
              type: integer
            comparison_count:
              type: integer
        evaluation:
          type: array
          description: Three-layer presentation slices for goal, issues, and suggestions
          items:
            $ref: "#/components/schemas/EvaluationLayer"
        dual_column:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonRow"
        refine_cards:
          type: array
          items:
            $ref: "#/components/schemas/RefineCard"
        review:
          $ref: "#/components/schemas/ReviewDoc"
        refine:
          $ref: "#/components/schemas/RefineDoc"
    TranscriptTurn:
      type: object
      required: [seq, speaker, text]
      properties:
        seq: { type: integer }
        speaker:
          type: string
          enum: [user, ai]
        text: { type: string }
    GoalAchievement:
      type: object
      required: [met, note]
      properties:
        met: { type: boolean }
        note: { type: string }
    ReviewIssue:
      type: object
      required: [type, original_quote, hint]
      properties:
        type:
          type: string
          enum: [grammar, idiomatic, missing_info]
        original_quote:
          type: string
        hint:
          type: string
    SuggestionItem:
      type: object
      required: [text]
      properties:
        text:
          type: string
    ComparisonRow:
      type: object
      required: [user, better]
      properties:
        user:
          type: string
        better:
          type: string
    RefineCard:
      type: object
      required: [intent_zh, expression_en, anchor_user_said, scene_tag, function_tag]
      properties:
        intent_zh:
          type: string
        expression_en:
          type: string
        anchor_user_said:
          type: string
        scene_tag:
          type: string
          enum: [standup, review, 1on1, interview, casual]
        function_tag:
          type: string
          enum: [object, clarify, report, propose, agree, disagree, ask, summarize, defer, commit]
    RefineDoc:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/RefineCard"
    ReviewDoc:
      type: object
      required: [goal_achievement, issues, suggestions, comparisons]
      properties:
        goal_achievement:
          $ref: "#/components/schemas/GoalAchievement"
        issues:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ReviewIssue"
        suggestions:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SuggestionItem"
        comparisons:
          type: array
          minItems: 0
          items:
            $ref: "#/components/schemas/ComparisonRow"
    EvaluationLayer:
      type: object
      required: [layer, title, content]
      properties:
        layer:
          type: string
          enum: [goal, issues, suggestions]
        title:
          type: string
        content:
          description: Presentation payload for the layer
          oneOf:
            - $ref: "#/components/schemas/GoalAchievement"
            - type: array
              items:
                $ref: "#/components/schemas/ReviewIssue"
            - type: array
              items:
                $ref: "#/components/schemas/SuggestionItem"
    PostMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 4096
        channel:
          type: string
          description: Must be "text" for degrade path; omit or non-text yields CONFLICT while voice is preferred
    PostMessageResponse:
      type: object
      required: [session_id, reply, channel, generator]
      properties:
        session_id: { type: string }
        reply: { type: string }
        channel:
          type: string
          enum: [text]
        generator: { type: string }
