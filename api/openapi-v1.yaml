openapi: 3.0.3
info:
  title: FluentWork app-server
  version: 0.2.0
  description: First-wave contracts for guest auth, merge, and session creation.
servers:
  - url: /api/v1
paths:
  /auth/guest:
    post:
      summary: Issue or reuse a device-bound guest identity
      operationId: issueGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Token pair for the device identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/merge:
    post:
      summary: Merge guest data onto the authenticated registered account
      operationId: mergeGuestAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Merge result, including idempotent retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions:
    post:
      summary: Create a practice session and issue a one-time WSS ticket
      operationId: createSession
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                material_id:
                  type: string
                  nullable: true
                  maxLength: 36
                scene_type:
                  type: string
                  maxLength: 64
                  default: demo
      responses:
        "200":
          description: Session id, WSS URL, and ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenResponse:
      type: object
      required: [user_id, is_guest, status, access_token, refresh_token, token_type, expires_in]
      properties:
        user_id: { type: string }
        is_guest: { type: boolean }
        status: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
    MergeResponse:
      type: object
      required: [user_id, is_guest, already_merged]
      properties:
        user_id: { type: string }
        is_guest: { type: boolean }
        merged_from_user_id:
          type: string
          nullable: true
        already_merged: { type: boolean }
    CreateSessionResponse:
      type: object
      required: [session_id, wss_url, ticket, ticket_expires_in, ticket_expires_at, scene_type, status]
      properties:
        session_id: { type: string }
        wss_url: { type: string }
        ticket: { type: string }
        ticket_expires_in: { type: integer }
        ticket_expires_at: { type: string, format: date-time }
        scene_type: { type: string }
        status: { type: string }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
