openapi: 3.0.3
info:
  title: FluentWork app-server
  version: 0.3.8
  description: Contracts for guest auth, merge, sessions, second-wave review, B17 TTS, B19 B7 hit injection, B22 drill, A4 privacy, B18 review eval, B24 session history, B21 materials, and B23 topic cards.
servers:
  - url: /api/v1
paths:
  /auth/guest:
    post:
      summary: Issue or reuse a device-bound guest identity
      operationId: issueGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Token pair for the device identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/merge:
    post:
      summary: Merge guest data onto the authenticated registered account
      operationId: mergeGuestAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Merge result, including idempotent retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/data:
    delete:
      summary: Soft-delete the authenticated user's data (A4)
      description: |
        Requires confirmation_code `DELETE-MY-DATA`. Soft-deletes users,
        phrase_blocks, and practice_sessions; hard-deletes drill_records;
        anonymizes ai_cost_logs. Idempotent on a second call. Wrong confirmation
        returns 422 FAILED_PRECONDITION. Per 48 §1.1.6.
      operationId: deleteAccountData
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountDataRequest"
      responses:
        "200":
          description: Cascade counts and backup purge deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountDataResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/export:
    post:
      summary: Enqueue a personal data export job
      description: |
        Returns export_id immediately. Email delivery is a V1.5 stub
        (estimated_ready_at is now + 24h). Per 48 §1.1.7.
      operationId: exportAccountData
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportAccountDataRequest"
      responses:
        "200":
          description: Export job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportAccountDataResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions:
    get:
      summary: List the caller's practice sessions
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Cursor page of sessions (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a practice session and issue a one-time WSS ticket
      operationId: createSession
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                material_id:
                  type: string
                  nullable: true
                  maxLength: 36
                scene_type:
                  type: string
                  maxLength: 64
                  default: demo
      responses:
        "200":
          description: Session id, WSS URL, and ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{id}:
    get:
      summary: Get one practice session with utterances and review eval
      operationId: getSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "403":
          description: Session owned by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found or A4-deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{id}/review:
    get:
      summary: Poll review readiness for a practice session
      operationId: getSessionReview
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review is ready (includes optional B18 eval)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPollResponse"
        "202":
          description: Review still pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPollResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{id}/messages:
    post:
      summary: Send a degraded text message (stub AI reply)
      description: |
        Non-streaming text fallback. Requires `channel: text`.
        Omitting channel or using a non-text channel returns CONFLICT while voice is preferred.
        Only the session owner may post; session must be `created` or `active`.
      operationId: postSessionMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: Stub AI reply for text degrade mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMessageResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks:
    get:
      summary: List corpus phrase blocks
      description: |
        Browse order is pinned first, then favorite, then updated_at descending.
        Use favorite_only=true or pinned_only=true to filter. Incremental sync
        (updated_after) cannot be combined with those filters.
      operationId: listCorpusBlocks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: scene
          schema: { type: string }
        - in: query
          name: func
          schema: { type: string }
        - in: query
          name: kw
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: updated_after
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: favorite_only
          schema: { type: boolean }
        - in: query
          name: pinned_only
          schema: { type: boolean }
      responses:
        "200":
          description: Corpus phrase block page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPhraseBlocksResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks/batch-accept:
    post:
      summary: Batch accept refine blocks into corpus
      operationId: batchAcceptCorpusBlocks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchAcceptBlocksRequest"
      responses:
        "200":
          description: Accepted phrase blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAcceptBlocksResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks/{id}:
    put:
      summary: Update one phrase block
      operationId: updateCorpusBlock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhraseBlockRequest"
      responses:
        "200":
          description: Updated phrase block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseBlock"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Soft delete one phrase block
      operationId: deleteCorpusBlock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks/{id}/pin:
    patch:
      summary: Pin or unpin one phrase block
      operationId: pinCorpusBlock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPinRequest"
      responses:
        "200":
          description: Updated phrase block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseBlock"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks/{id}/favorite:
    patch:
      summary: Favorite or unfavorite one phrase block
      operationId: patchCorpusBlockFavorite
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchFavoriteRequest"
      responses:
        "200":
          description: Updated phrase block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseBlock"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      deprecated: true
      summary: Toggle favorite and pin state
      description: |
        Deprecated. Use PATCH /corpus/blocks/{id}/pin and
        PATCH /corpus/blocks/{id}/favorite. Removed in V1.5.
      operationId: favoriteCorpusBlock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoritePhraseBlockRequest"
      responses:
        "200":
          description: Updated phrase block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseBlock"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /daily-reads/today:
    get:
      summary: Get or generate today's daily read
      operationId: getDailyReadToday
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daily read poll payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReadTodayResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /daily-reads/{id}/follow-read:
    post:
      summary: Submit a follow-read recording without scoring
      operationId: postDailyReadFollowRead
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowReadRequest"
      responses:
        "200":
          description: Follow-read acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowReadResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drill/round:
    get:
      summary: Fetch due flash-drill cards
      description: |
        Returns up to `size` due phrase blocks (default 10, max 20).
        new/training first, then automated. Per 48 §1.5.
      operationId: getDrillRound
      security:
        - bearerAuth: []
      parameters:
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Drill round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrillRound"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drill/judge:
    post:
      summary: Score one drill attempt and advance SM-2
      description: |
        Semantic judge with 1.5s timeout. Parse/timeout is a miss.
        Fail → next_due_at now+1h. Pass streak under 3 → +24h training.
        Pass streak≥3 → automated +7d. Automated pass → +30d. Per 48 §1.5.
      operationId: postDrillJudge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrillJudgeRequest"
      responses:
        "200":
          description: Judge result and updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrillJudgeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /materials:
    post:
      summary: Create a material and enqueue phrase-block refine
      operationId: createMaterial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                kind:
                  type: string
                  enum: [paste, sentence, url]
                  default: paste
                content:
                  type: string
                  maxLength: 5000
      responses:
        "202":
          description: Material queued for refine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMaterialResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /materials/{id}:
    get:
      summary: Poll material refine status
      operationId: getMaterial
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Material including refine_status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "403":
          description: Owned by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Missing or A4-deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /topic-cards:
    get:
      summary: List today's topic cards
      operationId: listTopicCards
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Today's cards (possibly empty before generation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicCardList"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /topic-cards/{id}/checkin:
    post:
      summary: Check in a topic card
      operationId: checkinTopicCard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reflection:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Checkin recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicCheckinResult"
        "403":
          description: Owned by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/tts/synthesize:
    post:
      servers:
        - url: /
      summary: Synthesize speech with Volc streaming TTS and duplex fallback
      description: |
        Internal endpoint (X-Internal-Token). Primary provider is Volc HTTP/2
        unidirectional TTS. After three consecutive HTTP 5xx responses, traffic
        switches to the duplex TTS fallback and increments
        tts_fallback_triggered_total{from="volc_streaming",to="volc_duplex"}
        on GET /metrics.
      operationId: synthesizeTTS
      security:
        - internalToken: []
      parameters:
        - name: voice_id
          in: query
          required: false
          schema:
            type: string
          description: Overrides JSON voice_id. D-2 catalog or a raw Volc speaker id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TTSSynthesizeRequest"
      responses:
        "200":
          description: Concatenated audio chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TTSSynthesizeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/voicegateway/hits:
    post:
      servers:
        - url: /
      summary: Record B7 phrase-block hits from the voice gateway
      description: |
        Internal endpoint (X-Internal-Token). UPSERTs phrase_block_uses for
        (session_id, turn_id, block_id) and increments phrase_blocks.total_uses
        only on first insert. Duplicate reports of the same hit do not double-count.
      operationId: recordVoiceGatewayHits
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceGatewayHitsRequest"
      responses:
        "200":
          description: Number of hits written to the ledger (including UPSERT updates)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceGatewayHitsResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/sessions/{session_id}/recent-hits:
    get:
      servers:
        - url: /
      summary: Fetch recent B7 hits for LLM prompt injection
      description: |
        Internal endpoint (X-Internal-Token). Returns hits from the most recent
        lookback_turns in the session, joined to phrase block intent_zh / chunk_en.
        Soft-deleted blocks are omitted. ttl_at_ms is the newest used_at_ms + 60000.
        min_score is accepted for 48_ §2.7 compatibility; recorded hits already
        passed B7 detection and phrase_blocks has no score column.
      operationId: getSessionRecentHits
      security:
        - internalToken: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: lookback_turns
          in: query
          required: false
          schema: { type: integer, default: 8, minimum: 0 }
        - name: min_score
          in: query
          required: false
          schema: { type: number, format: float, default: 0.7 }
      responses:
        "200":
          description: Recent hits and injection TTL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentHitsResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/support/undelete-user:
    post:
      servers:
        - url: /
      summary: Restore a user within the 30-day A4 window
      description: |
        Internal endpoint (X-Internal-Token). Restores users, phrase_blocks,
        practice_sessions, and ai_cost_logs; deletes tombstones; writes
        audit_logs. Expired window or not-deleted account returns 422.
        Per 48 §2.8.
      operationId: undeleteUser
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndeleteUserRequest"
      responses:
        "200":
          description: Restore counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndeleteUserResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    TokenResponse:
      type: object
      required: [user_id, is_guest, status, access_token, refresh_token, token_type, expires_in]
      properties:
        user_id: { type: string }
        is_guest: { type: boolean }
        status: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
    MergeResponse:
      type: object
      required: [user_id, is_guest, already_merged]
      properties:
        user_id: { type: string }
        is_guest: { type: boolean }
        merged_from_user_id:
          type: string
          nullable: true
        already_merged: { type: boolean }
    DeleteAccountDataRequest:
      type: object
      required: [confirmation_code]
      properties:
        confirmation_code:
          type: string
          description: Must be DELETE-MY-DATA
    DeleteAccountDataResponse:
      type: object
      required: [cascaded, backup_purge_at, already_deleted]
      properties:
        cascaded:
          type: object
          additionalProperties: { type: integer }
        backup_purge_at: { type: string, format: date-time }
        already_deleted: { type: boolean }
    ExportAccountDataRequest:
      type: object
      properties:
        email_to: { type: string }
    ExportAccountDataResponse:
      type: object
      required: [export_id, email_to, estimated_ready_at]
      properties:
        export_id: { type: string }
        email_to: { type: string }
        estimated_ready_at: { type: string, format: date-time }
    DrillRound:
      type: object
      required: [size, cards]
      properties:
        size: { type: integer }
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DrillCard"
    DrillCard:
      type: object
      required: [block_id, intent_zh, expression_en, state]
      properties:
        block_id: { type: string }
