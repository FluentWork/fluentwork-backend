openapi: 3.0.3
info:
  title: FluentWork app-server
  version: 0.3.0
  description: Contracts for guest auth, merge, sessions, and second-wave review full model.
servers:
  - url: /api/v1
paths:
  /auth/guest:
    post:
      summary: Issue or reuse a device-bound guest identity
      operationId: issueGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Token pair for the device identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/merge:
    post:
      summary: Merge guest data onto the authenticated registered account
      operationId: mergeGuestAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Merge result, including idempotent retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions:
    post:
      summary: Create a practice session and issue a one-time WSS ticket
      operationId: createSession
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                material_id:
                  type: string
                  nullable: true
                  maxLength: 36
                scene_type:
                  type: string
                  maxLength: 64
                  default: demo
      responses:
        "200":
          description: Session id, WSS URL, and ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{id}/review:
    get:
      summary: Poll review readiness for a practice session
      operationId: getSessionReview
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review poll payload (pending, ready, or failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPollResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{id}/messages:
    post:
      summary: Send a degraded text message (stub AI reply)
      description: |
        Non-streaming text fallback. Requires `channel: text`.
        Omitting channel or using a non-text channel returns CONFLICT while voice is preferred.
        Only the session owner may post; session must be `created` or `active`.
      operationId: postSessionMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: Stub AI reply for text degrade mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostMessageResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks:
    get:
      summary: List corpus phrase blocks
      operationId: listCorpusBlocks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: scene
          schema: { type: string }
        - in: query
          name: func
          schema: { type: string }
        - in: query
          name: kw
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: updated_after
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: favorite_only
          schema: { type: boolean }
      responses:
        "200":
          description: Corpus phrase block page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPhraseBlocksResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks/batch-accept:
    post:
      summary: Batch accept refine blocks into corpus
      operationId: batchAcceptCorpusBlocks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchAcceptBlocksRequest"
      responses:
        "200":
          description: Accepted phrase blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAcceptBlocksResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks/{id}:
    put:
      summary: Update one phrase block
      operationId: updateCorpusBlock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhraseBlockRequest"
      responses:
        "200":
          description: Updated phrase block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseBlock"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Soft delete one phrase block
      operationId: deleteCorpusBlock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /corpus/blocks/{id}/favorite:
    post:
      summary: Toggle favorite and pin state
      operationId: favoriteCorpusBlock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoritePhraseBlockRequest"
      responses:
        "200":
          description: Updated phrase block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseBlock"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /daily-reads/today:
    get:
      summary: Get or generate today's daily read
      operationId: getDailyReadToday
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daily read poll payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReadTodayResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /daily-reads/{id}/follow-read:
    post:
      summary: Submit a follow-read recording without scoring
      operationId: postDailyReadFollowRead
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowReadRequest"
      responses:
        "200":
          description: Follow-read acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowReadResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenResponse:
      type: object
      required: [user_id, is_guest, status, access_token, refresh_token, token_type, expires_in]
      properties:
        user_id: { type: string }
        is_guest: { type: boolean }
        status: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
    MergeResponse:
      type: object
      required: [user_id, is_guest, already_merged]
      properties:
        user_id: { type: string }
        is_guest: { type: boolean }
        merged_from_user_id:
          type: string
          nullable: true
        already_merged: { type: boolean }
    CreateSessionResponse:
      type: object
      required: [session_id, wss_url, ticket, ticket_expires_in, ticket_expires_at, scene_type, status]
      properties:
        session_id: { type: string }
        wss_url: { type: string }
        ticket: { type: string }
        ticket_expires_in: { type: integer }
        ticket_expires_at: { type: string, format: date-time }
        scene_type: { type: string }
        status: { type: string }
    ReviewPollResponse:
      type: object
      required: [session_id, status]
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [pending, ready, failed]
        review:
          $ref: "#/components/schemas/ReviewReadyPayload"
          description: Present when status is ready
    ReviewReadyPayload:
      type: object
      required: [generator, status, transcript, overview, evaluation, dual_column, refine_cards, review, refine]
      properties:
        generator:
          type: string
        status:
          type: string
          enum: [ready]
        duration_sec:
          type: integer
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTurn"
        overview:
          type: object
          required: [goal_achievement, issue_count, suggestion_count, comparison_count]
          properties:
            goal_achievement:
              $ref: "#/components/schemas/GoalAchievement"
            issue_count:
              type: integer
            suggestion_count:
              type: integer
            comparison_count:
              type: integer
        evaluation:
          type: array
          description: Three-layer presentation slices for goal, issues, and suggestions
          items:
            $ref: "#/components/schemas/EvaluationLayer"
        dual_column:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonRow"
        refine_cards:
          type: array
          items:
            $ref: "#/components/schemas/RefineCard"
        review:
          $ref: "#/components/schemas/ReviewDoc"
        refine:
          $ref: "#/components/schemas/RefineDoc"
    TranscriptTurn:
      type: object
      required: [seq, speaker, text]
      properties:
        seq: { type: integer }
        speaker:
          type: string
          enum: [user, ai]
        text: { type: string }
    GoalAchievement:
      type: object
      required: [met, note]
      properties:
        met: { type: boolean }
        note: { type: string }
    ReviewIssue:
      type: object
      required: [type, original_quote, hint]
      properties:
        type:
          type: string
          enum: [grammar, idiomatic, missing_info]
        original_quote:
          type: string
        hint:
          type: string
    SuggestionItem:
      type: object
      required: [text]
      properties:
        text:
          type: string
    ComparisonRow:
      type: object
      required: [user, better]
      properties:
        user:
          type: string
        better:
          type: string
    RefineCard:
      type: object
      required: [intent_zh, expression_en, anchor_user_said, scene_tag, function_tag]
      properties:
        intent_zh:
          type: string
        expression_en:
          type: string
        anchor_user_said:
          type: string
        scene_tag:
          type: string
          enum: [standup, review, 1on1, interview, casual]
        function_tag:
          type: string
          enum: [object, clarify, report, propose, agree, disagree, ask, summarize, defer, commit]
    RefineDoc:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/RefineCard"
    ReviewDoc:
      type: object
      required: [goal_achievement, issues, suggestions, comparisons]
      properties:
        goal_achievement:
          $ref: "#/components/schemas/GoalAchievement"
        issues:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ReviewIssue"
        suggestions:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SuggestionItem"
        comparisons:
          type: array
          minItems: 0
          items:
            $ref: "#/components/schemas/ComparisonRow"
    EvaluationLayer:
      type: object
      required: [layer, title, content]
      properties:
        layer:
          type: string
          enum: [goal, issues, suggestions]
        title:
          type: string
        content:
          description: Presentation payload for the layer
          oneOf:
            - $ref: "#/components/schemas/GoalAchievement"
            - type: array
              items:
                $ref: "#/components/schemas/ReviewIssue"
            - type: array
              items:
                $ref: "#/components/schemas/SuggestionItem"
    PostMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 4096
        channel:
          type: string
          description: Must be "text" for degrade path; omit or non-text yields CONFLICT while voice is preferred
    PostMessageResponse:
      type: object
      required: [session_id, reply, channel, generator]
      properties:
        session_id: { type: string }
        reply: { type: string }
        channel:
          type: string
          enum: [text]
        generator: { type: string }
    PhraseBlock:
      type: object
      required: [id, intent_zh, expression_en, anchor_user_said, scene_tag, function_tag, state, success_streak, next_due_at, ease_factor, real_use_count, is_favorite, created_at, updated_at]
      properties:
        id: { type: string }
        intent_zh: { type: string }
        expression_en: { type: string }
        anchor_user_said: { type: string }
        scene_tag:
          type: string
          enum: [standup, review, 1on1, interview, casual]
        function_tag:
          type: string
          enum: [object, clarify, report, propose, agree, disagree, ask, summarize, defer, commit]
        state:
          type: string
          enum: [new, training, automated]
        success_streak: { type: integer }
        next_due_at: { type: string, format: date-time }
        ease_factor: { type: number }
        real_use_count: { type: integer }
        is_favorite: { type: boolean }
        pinned_at:
          type: string
          format: date-time
          nullable: true
        source_session_id:
          type: string
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListPhraseBlocksResponse:
      type: object
      required: [items, cursor_reset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhraseBlock"
        next_cursor:
          type: string
        cursor_reset:
          type: boolean
    UpdatePhraseBlockRequest:
      type: object
      required: [intent_zh, expression_en, anchor_user_said, scene_tag, function_tag]
      properties:
        intent_zh: { type: string }
        expression_en: { type: string }
        anchor_user_said: { type: string }
        scene_tag:
          type: string
          enum: [standup, review, 1on1, interview, casual]
        function_tag:
          type: string
          enum: [object, clarify, report, propose, agree, disagree, ask, summarize, defer, commit]
    FavoritePhraseBlockRequest:
      type: object
      required: [is_favorite, pinned]
      properties:
        is_favorite: { type: boolean }
        pinned: { type: boolean }
    BatchAcceptBlocksRequest:
      type: object
      required: [source_session_id, blocks]
      properties:
        source_session_id: { type: string }
        blocks:
          type: array
          minItems: 1
          items:
            type: object
            required: [intent_zh, expression_en, anchor_user_said, scene_tag, function_tag]
            properties:
              intent_zh: { type: string }
              expression_en: { type: string }
              anchor_user_said: { type: string }
              scene_tag:
                type: string
                enum: [standup, review, 1on1, interview, casual]
              function_tag:
                type: string
                enum: [object, clarify, report, propose, agree, disagree, ask, summarize, defer, commit]
    BatchAcceptBlocksResponse:
      type: object
      required: [accepted_count, items]
      properties:
        accepted_count: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhraseBlock"
    DailyReadTodayResponse:
      type: object
      required: [gen_date, status]
      properties:
        gen_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, ready, failed]
        daily_read:
          $ref: "#/components/schemas/DailyRead"
    DailyRead:
      type: object
      required: [id, title, body, generator]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        audio_url:
          type: string
          nullable: true
        generator: { type: string }
        used_block_ids:
          type: array
          items: { type: string }
        source_refs:
          type: object
          additionalProperties: true
        read_score:
          type: number
          nullable: true
    FollowReadRequest:
      type: object
      properties:
        audio_url:
          type: string
          nullable: true
    FollowReadResponse:
      type: object
      required: [daily_read_id, recorded, read_score, generator]
      properties:
        daily_read_id: { type: string }
        recorded: { type: boolean }
        read_score:
          type: number
          nullable: true
        generator: { type: string }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
