          enum: [standup, review, 1on1, interview, casual]
        function_tag:
          type: string
          enum: [object, clarify, report, propose, agree, disagree, ask, summarize, defer, commit]
        state:
          type: string
          enum: [new, training, automated]
        success_streak: { type: integer }
        next_due_at: { type: string, format: date-time }
        ease_factor: { type: number }
        real_use_count: { type: integer }
        is_favorite: { type: boolean }
        pinned_at:
          type: string
          format: date-time
          nullable: true
        source_session_id:
