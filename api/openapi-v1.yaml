      properties:
        pass: { type: boolean }
        judge_reason: { type: string }
        success_streak: { type: integer }
        state: { type: string }
        next_due_at: { type: string, format: date-time }
        recorded: { type: boolean }
    UndeleteUserRequest:
      type: object
      required: [user_id]
