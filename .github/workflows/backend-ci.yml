name: backend-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate expected backend skeleton
        run: |
          set -euo pipefail
          test -d cmd/app-server
          test -d cmd/voice-gateway
          test -d cmd/worker
          test -d internal
          test -d migrations
          test -f go.mod
          echo "Repository skeleton is present."

  go-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet packages
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build packages
        run: go build ./...
