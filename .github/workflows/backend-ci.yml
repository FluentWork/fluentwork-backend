name: backend-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate expected backend skeleton
        run: |
          set -euo pipefail
          test -d cmd/app-server
          test -d cmd/voice-gateway
          test -d cmd/worker
          test -d internal
          test -d migrations
          test -f go.mod
          echo "Repository skeleton is present."

  go-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Go quality tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Check gofumpt formatting
        run: |
          GOFUMPT_BIN="$(go env GOPATH)/bin/gofumpt"
          test -z "$("$GOFUMPT_BIN" -l .)"

      - name: Check goimports formatting
        run: |
          GOIMPORTS_BIN="$(go env GOPATH)/bin/goimports"
          test -z "$("$GOIMPORTS_BIN" -l .)"

      - name: Run golangci-lint
        run: |
          GOLANGCI_LINT_BIN="$(go env GOPATH)/bin/golangci-lint"
          "$GOLANGCI_LINT_BIN" run ./...

      - name: Run tests
        run: go test ./...

      - name: Build packages
        run: go build ./...
