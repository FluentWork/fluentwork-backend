name: opencode-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Contract with alibaba/open-code-review (composite action.yml):
    # the "Run OpenCodeReview" step redirects `ocr review --format json`
    # stdout to /tmp/ocr-result.json on the shared runner filesystem.
    # Gate script is always loaded from the PR base (trusted), never from
    # the untrusted PR head.
    env:
      OCR_RESULT_FILE: /tmp/ocr-result.json
    steps:
      - name: Check review secrets availability
        id: preflight
        env:
          OCR_LLM_URL: ${{ secrets.OPENCODEREVIEW_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OPENCODEREVIEW_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OPENCODEREVIEW_LLM_MODEL }}
        run: |
          if [ -n "${OCR_LLM_URL}" ] && [ -n "${OCR_LLM_TOKEN}" ] && [ -n "${OCR_LLM_MODEL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Skip until review secrets are configured
        if: steps.preflight.outputs.enabled != 'true'
        run: echo "OpenCodeReview is initialized but skipped because required secrets are not configured yet."

      - name: Run OpenCodeReview
        id: ocr
        if: steps.preflight.outputs.enabled == 'true'
        # Pin to commit SHA (not floating @main) for supply-chain reproducibility.
        uses: alibaba/open-code-review@cfbb62e2296d7684dc648e27fe1b906e8c960f9c
        with:
          llm_url: ${{ secrets.OPENCODEREVIEW_LLM_URL }}
          llm_auth_token: ${{ secrets.OPENCODEREVIEW_LLM_TOKEN }}
          llm_model: ${{ secrets.OPENCODEREVIEW_LLM_MODEL }}
          llm_use_anthropic: 'false'
          language: 中文
          sticky_summary: 'true'
          incremental: 'true'
          route_severity_below: medium
          upload_artifacts: 'true'

      - name: Checkout trusted OCR gate script from base
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/ocr-fail-on-high.sh
          sparse-checkout-cone-mode: false

      - name: Fail on critical/high OCR findings
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          if [[ ! -f "${OCR_RESULT_FILE}" ]]; then
            echo "error: OCR result missing at ${OCR_RESULT_FILE}"
            echo "Expected alibaba/open-code-review to write JSON there (action.yml Run OpenCodeReview step)."
            exit 1
          fi
          bash ./scripts/ocr-fail-on-high.sh "${OCR_RESULT_FILE}"
