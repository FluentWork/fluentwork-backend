services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fluentwork
      MYSQL_USER: fw
      MYSQL_PASSWORD: fw
      MYSQL_ROOT_PASSWORD: fwroot
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufw", "-pfw"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
